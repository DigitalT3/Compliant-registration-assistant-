# Fly.io settings for the hosted PoC. Region cdg (Paris) sits next to the Supabase project (eu-west-3).
# Change `app` to a name nobody else uses. Secrets (database URL, AWS keys) are set with `fly secrets`, not here.
app = "dt3-complaint-poc"
primary_region = "cdg"

[env]
  POC_DB = "postgres"
  POC_DEMO_MODE = "0"
  SERVE_FRONTEND = "1"
  AI_TIMEOUT_S = "8"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "40s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "10s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
